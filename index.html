<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Tester</title>
  </head>
  <body>
    <h1>Color Palette Tester</h1>
    <div>

      <input type="color" id="color1" />

    <div>
      <input type="text" id="hex2" placeholder="#000000" />
      <input type="color" id="color2" />
    </div>
    <div>
      <input type="text" id="hex3" placeholder="#000000" />
      <input type="color" id="color3" />
    </div>
    <div>
      <input type="text" id="hex4" placeholder="#000000" />
      <input type="color" id="color4" />
    </div>
    <div>
      <input type="text" id="hex5" placeholder="#000000" />
      <input type="color" id="color5" />
    </div>
    <div>
      <input type="text" id="hex6" placeholder="#000000" />
      <input type="color" id="color6" />
    </div>

    <br />

    <button type="button" id="test-palette">Test Palette</button>

    <div id="results"></div>

    <script src="https://colorjs.io/dist/color.global.js"></script>
    <script src="app.js"></script>
  </body>
</html>
