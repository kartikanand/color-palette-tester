<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Tester</title>

    <style>
      .palette-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .palette-color {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .palette-color > input[type="text"] {
        width: 10rem;
      }

      .palette-color > button {
        width: 10rem;
      }
    </style>
  </head>
  <body>
    <h1>Color Palette Tester</h1>
    <div class="palette-container"></div>

    <br />

    <button type="button" id="test-palette">Test Palette</button>

    <div id="results"></div>

    <script src="https://colorjs.io/dist/color.global.js"></script>
    <script src="app.js"></script>
  </body>
</html>
